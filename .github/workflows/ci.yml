name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # PRD N-08: C ツールチェインを要求しないことを機械的に担保する。
  # `cc` crate が依存ツリーに現れたら、どこかで C をビルドしている。
  no-c-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert no `cc` crate in the dependency tree
        shell: bash
        run: |
          if cargo tree --workspace --all-features --invert cc 2>/dev/null | grep -q .; then
            echo '::error::the cc crate was found in the dependency tree.'
            echo "CrystalSKK must build without a C toolchain (PRD N-08)."
            cargo tree --workspace --all-features --invert cc
            exit 1
          fi
          echo "No C toolchain dependency."
