# CrystalSKK の設定
#
# ここに書かれている値が、効いている設定のすべてです。CrystalSKK は
# 既定値を持たず、このファイルに無い値で動くことはありません。
#
# 新しい版で項目が増えたときは、その項目をこのファイルに書き足してから
# 使います。書き足した項目には、そのことを注記します。項目を消した
# ときも同じで、この雛形の値で書き戻します。
#
# 書き換えた値は、入力先を切り替えたときに効きます。

[completion]
# 打っている最中に、見出し語の続きを補完して見せるか。
# 補完候補は下線の無い文字で出し、候補の窓にも変換先を一行出します。
# 切っても Tab による補完は使えます。
dynamic = true

# 補完を始める見出し語の長さ (文字数)。
# 一文字では絞り込めません。「あ」で始まる見出しは山ほどあります。
min_length = 2

# 一度に覚えておく補完の数。Tab はこの範囲を巡ります。
limit = 16

# 補完候補を受け取り、変換して確定するキー。一文字で書きます。
# 補完候補が出ていないときは、普通の文字として打てます。
take_key = "."

# 補完の窓に、変換先と一緒に読みも出すか。
# 読みは未確定の文字として見えているので、ふつうは要りません。
show_reading = false

[candidates]
# 何回目の変換から候補を一覧にするか。
# 候補はまず一つずつ見せ、何度か送って決まらないときに一覧に頼ります。
until_list = 5

# 一覧から候補を選ぶキー。
# 並べた順にラベルになり、この数が一度に出す候補の数になります。
labels = "asdfjkl"

# 候補の注釈 (辞書の ; より後ろ) を窓に出すか。入力欄には出しません。
# 候補を一つずつ見せているあいだは注釈だけの窓を出し、長ければ折り返します。
# 一覧では候補の右に薄く出し、長ければ途中で切ります。
show_annotation = true

[ranker]
# 変換の候補を、カーソルの前後の文章に合わせて並べ替えるか。
# 小さな言語モデルに「どの候補ならその文脈に自然か」を採点させ、辞書の
# 順と合わせて並べます。最後に使った語は先頭から動かしません。
# パスワードの入力欄では前後の文章を読まず、読んだ文章は保存しません。
# 言語モデルは CrystalSKK と一緒に導入されます。
# 変換のたびに 10〜20 ミリ秒ほど計算します。
enabled = true

# 辞書の順をどれだけ重んじるか。0 なら言語モデルの採点だけで並べます。
# 大きくするほど、辞書の順から動きにくくなります。
weight = 1.0

# 並べ替えを待つ時間 (ミリ秒)。間に合わなければ辞書の順で出します。
deadline_ms = 100

# 言語モデルに見せる、カーソルより前と後の文章の長さ (文字数)。
before = 100
after = 5

# 辞書の順で上から何個までを並べ替えるか。それより後ろの候補は
# 辞書の順のまま出します。後ろのほうの珍しい候補が、たまたま良い点を
# 取って先頭に来るのを防ぎます。
top = 7

# 前後の文章に何文字あれば並べ替えるか。句読点・記号・空白は数えません。
# 行の頭や「。」の直後のように手がかりがほとんど無いときは、辞書の順の
# ほうが当たります。0 なら、前後がまったくの空のときだけ並べ替えません。
min_context = 2

# 採点に使うスレッドの数。
threads = 4

[mode_indicator]
# カーソルのそばに、いまの入力モードの絵を短く出します。
# 位置はアプリが教えてくれる文字の位置を使うので、教えてくれない
# アプリでは出ません。

# モードや入切を切り替えたときに出すか。
on_switch = true

# 入力先 (入力欄) に入ったときにも出すか。
# 窓や入力欄を行き来するたびに出ます。
on_focus = false

# 出しておく時間 (ミリ秒)。
duration_ms = 1000

[markers]
# 未確定の文字に付く印を、入力先に書くときの文字。
# 状態は下線で分かるので、既定では記号を出しません。"" は何も出さない
# ということです。
#
# SKK のおなじみの見た目にするなら、次のように書きます。
#   composing = "▽"
#   composing_empty = ""
#   selecting = "▼"
#   okuri = "*"

# 見出し語を打っているあいだ (▽)。
composing = ""

# 見出し語をまだ打っていないとき (▽ だけのとき) に、composing の後ろに
# 足すもの。読みを全部消しても、ここに下線が引かれて、変換を始めた
# ところだと分かります。
# "\u00A0" は改行しない空白で、幅は普通の空白と同じです。普通の空白
# (" ") だと、アプリによっては下線が引かれません。
composing_empty = "\u00A0"

# 候補を選んでいるあいだ (▼)。
selecting = ""

# 見出し語と送り仮名の境 (*)。境は下線の模様 (点線と破線) で分かります。
okuri = ""

[colors]
# 候補の窓と、カーソルのそばに出す入力モードの窓の色。
#
# 明るい組 ([colors.light]) と暗い組 ([colors.dark]) の、どちらを使うか。
# "auto" は Windows の「アプリ モード」の明るさに合わせます。"light" か
# "dark" で決め打ちにもできます。
# ハイコントラストの配色を選んでいるときは、ここにかかわらず、その配色に
# 従います。
theme = "auto"

# Windows 11 では、窓の地を少し透かします (すりガラス)。その上に重ねる地の
# 色の濃さを、0 から 100 で書きます。小さいほど透け、100 で透けなくなります。
# Windows の「透明効果」を切っているときと、ハイコントラストのときは透かし
# ません。
backdrop_opacity = 65

# 色は "#RRGGBB" で書くほか、次の名前が使えます。
#   "system"  Windows の標準の色 (地・文字・枠・選んでいる行ごとに決まっている)
#   "accent"  Windows のアクセントカラー
# 明るい組。Windows の標準の地の色は真っ白なので、地は Windows 11 の
# メニューに近い色で書いてあります。暗い組と揃えて、文字も色で書いてあります。
[colors.light]
background = "#F9F9F9"
text = "#000000"
border = "system"
# 選んでいる行 (帯) の地と文字。"system" なら、地は地と文字の色を少し
# 混ぜた色、文字は本文と同じ色になります。
selected_background = "system"
selected_text = "system"
# 押すキーを囲む枠と、選んでいる行の左端の印。
key = "accent"

# 暗い組。Windows の標準の色はダークモードでも白いままなので、地と文字は
# 色で書いてあります。
[colors.dark]
background = "#2B2B2B"
text = "#FFFFFF"
border = "system"
selected_background = "system"
selected_text = "system"
key = "accent"

[popup]
# 候補の窓と、カーソルのそばのモードの窓の見た目。

# 大きさ (百分率、50 から 300)。モニターの拡大率に掛け合わせます。
# 文字も余白も絵も、まとめて大きくなります。
scale = 100

# 候補の窓の書体の名前 (例: "BIZ UDPGothic"、"Meiryo UI")。"system" なら
# Windows のメッセージの書体 (Yu Gothic UI など) に従います。
# 無い書体を書くと、Windows が似た書体で代わりに描きます。
font = "system"

# 候補の窓の文字の大きさ (ポイント、6 から 72)。"system" なら Windows の
# メッセージの書体の大きさ (ふつうは 9) に従います。行の高さや余白も
# 文字に合わせて変わります。
font_size = "system"

[dictionaries]
# 引く辞書。ユーザー辞書のあとに、上から順に引きます。候補もこの順に並び、
# 同じ語は先に出たほうにまとめます。補完もすべての辞書から引きます。
#
# URL を書くと取得して手元 (dictionaries フォルダ) に置き、辞書サーバが
# 起動するたびに更新を確かめます。変わっていなければ取り直しません。
# ファイルの場所を書くと、それを直に読みます。この設定ファイルと同じ
# 場所からの相対で書けます。
#
# { katakana_from = "…" } と書くと、その辞書に載っているカタカナ語を拾い、
# 語自身の読みで引ける辞書を作ります。L 辞書では、たとえば ヴァイオリン は
# violin の下にしか無く、読みで打っても出てきません。作るのは読み込むとき
# なので、元の辞書が更新されれば一緒に作り直されます。
#
# 辞書にはそれぞれの使用許諾があります。SKK-JISYO.L は GPL です。
sources = [
    "https://raw.githubusercontent.com/skk-dev/dict/master/SKK-JISYO.L",
    { katakana_from = "https://raw.githubusercontent.com/skk-dev/dict/master/SKK-JISYO.L" },
]

[romaji]
# ローマ字テーブルのファイル。このファイルと同じ場所からの相対で書けます。
# 無ければ雛形から作ります。あれば、CrystalSKK は中身を書き換えません。
table = "romaji.txt"
