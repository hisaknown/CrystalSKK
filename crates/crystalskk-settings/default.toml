# CrystalSKK の設定
#
# ここに書かれている値が、効いている設定のすべてです。CrystalSKK は
# 既定値を持たず、このファイルに無い値で動くことはありません。
#
# 新しい版で項目が増えたときは、その項目をこのファイルに書き足してから
# 使います。書き足した項目には、そのことを注記します。項目を消した
# ときも同じで、この雛形の値で書き戻します。
#
# 書き換えた値は、入力先を切り替えたときに効きます。

[completion]
# 打っている最中に、見出し語の続きを補完して見せるか。
# 補完候補は下線の無い文字で出し、候補の窓にも変換先を一行出します。
# 切っても Tab による補完は使えます。
dynamic = true

# 補完を始める見出し語の長さ (文字数)。
# 一文字では絞り込めません。「あ」で始まる見出しは山ほどあります。
min_length = 2

# 一度に覚えておく補完の数。Tab はこの範囲を巡ります。
limit = 16

# 補完候補を受け取り、変換して確定するキー。一文字で書きます。
# 補完候補が出ていないときは、普通の文字として打てます。
take_key = "."

# 補完の窓に、変換先と一緒に読みも出すか。
# 読みは未確定の文字として見えているので、ふつうは要りません。
show_reading = false

[candidates]
# 何回目の変換から候補を一覧にするか。
# 候補はまず一つずつ見せ、何度か送って決まらないときに一覧に頼ります。
until_list = 5

# 一覧から候補を選ぶキー。
# 並べた順にラベルになり、この数が一度に出す候補の数になります。
labels = "asdfjkl"

[dictionaries]
# 引く辞書。ユーザー辞書のあとに、上から順に引きます。候補もこの順に並び、
# 同じ語は先に出たほうにまとめます。補完もすべての辞書から引きます。
#
# URL を書くと取得して手元 (dictionaries フォルダ) に置き、辞書サーバが
# 起動するたびに更新を確かめます。変わっていなければ取り直しません。
# ファイルの場所を書くと、それを直に読みます。この設定ファイルと同じ
# 場所からの相対で書けます。
#
# 辞書にはそれぞれの使用許諾があります。SKK-JISYO.L は GPL です。
sources = [
    "https://raw.githubusercontent.com/skk-dev/dict/master/SKK-JISYO.L",
]

[romaji]
# ローマ字テーブルのファイル。このファイルと同じ場所からの相対で書けます。
# 無ければ雛形から作ります。あれば、CrystalSKK は中身を書き換えません。
table = "romaji.txt"
