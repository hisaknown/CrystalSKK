[package]
name = "crystalskk-tip"
description = "CrystalSKK as a TSF text input processor."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "crystalskk_tip"
crate-type = ["cdylib", "rlib"]

[dependencies]
crystalskk-core = { path = "../crystalskk-core" }
crystalskk-ipc = { path = "../crystalskk-ipc" }
crystalskk-server = { path = "../crystalskk-server" }
crystalskk-settings = { path = "../crystalskk-settings" }

# 絵は SVG からビルドのときに描く (ADR-0024)。DLL には描いた結果だけが入る。
[build-dependencies]
crystalskk-art = { path = "../crystalskk-art" }

# `#[implement]` の展開が windows-core を名前で参照するため、直接依存に入れる。
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

# COM サーバーを書くため、このクレートは unsafe を許す。
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
