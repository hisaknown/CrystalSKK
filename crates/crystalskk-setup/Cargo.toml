[package]
name = "crystalskk-setup"
description = "Install and remove CrystalSKK on this machine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "crystalskk-setup"
path = "src/main.rs"

[dependencies]
crystalskk-dict = { path = "../crystalskk-dict" }
crystalskk-fetch = { path = "../crystalskk-fetch" }
crystalskk-ipc = { path = "../crystalskk-ipc" }
crystalskk-server = { path = "../crystalskk-server" }
crystalskk-tip = { path = "../crystalskk-tip" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# 昇格のために Win32 を直接呼ぶ。unsafe は elevate.rs だけに置く。
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
