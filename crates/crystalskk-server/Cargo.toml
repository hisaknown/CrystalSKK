[package]
name = "crystalskk-server"
description = "The process that owns the dictionaries."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "crystalskk-server"
path = "src/main.rs"

[dependencies]
crystalskk-core = { path = "../crystalskk-core" }
crystalskk-dict = { path = "../crystalskk-dict" }
crystalskk-ipc = { path = "../crystalskk-ipc" }
# 置き場所を解くために借りる。Win32 を呼ぶ処理を二箇所に書きたくない。
crystalskk-tip = { path = "../crystalskk-tip" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
]

# 名前付きパイプを直に扱うため、このクレートは unsafe を許す。
# 触れるのは `pipe` モジュールだけに閉じる。
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
