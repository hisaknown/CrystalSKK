[package]
name = "crystalskk-fetch"
description = "Dictionary download over the system HTTP stack."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
crystalskk-dict = { path = "../crystalskk-dict" }

[dev-dependencies]
crystalskk-core = { path = "../crystalskk-core" }
encoding_rs = "0.8"

# WinHTTP を直接呼ぶため、このクレートだけ unsafe を許す。
# 対象は winhttp.rs に限る。
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
